name: Terraform PR Checks

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars.example"
      - ".github/workflows/terraform-pr.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Format, validate, and plan
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers for validation
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      # GitHub does not expose repository secrets to pull requests from forks.
      # Format and validation still run above; the state-aware plan is skipped.
      - name: Configure AWS credentials through OIDC
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Write protected Terraform variables
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          TFVARS_CONTENT: ${{ secrets.TF_VARS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TFVARS_CONTENT)) {
            throw "Missing TF_VARS GitHub secret. Store the complete terraform.tfvars content in this secret."
          }
          [System.IO.File]::WriteAllText("terraform.tfvars", $env:TFVARS_CONTENT, (New-Object System.Text.UTF8Encoding($false)))

      - name: Create state-aware Terraform plan
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TF_STATE_BUCKET) -or [string]::IsNullOrWhiteSpace($env:TF_STATE_KEY)) {
            throw "Set the TF_STATE_BUCKET and TF_STATE_KEY GitHub repository variables before enabling PR plans."
          }
          terraform init -reconfigure -input=false `
            -backend-config="bucket=$env:TF_STATE_BUCKET" `
            -backend-config="key=$env:TF_STATE_KEY" `
            -backend-config="region=$env:AWS_REGION" `
            -backend-config="encrypt=true" `
            -backend-config="use_lockfile=true"
          terraform plan -input=false -lock-timeout=5m -no-color -var-file="terraform.tfvars"

      - name: Remove protected Terraform variables
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "terraform.tfvars" -Force -ErrorAction SilentlyContinue
